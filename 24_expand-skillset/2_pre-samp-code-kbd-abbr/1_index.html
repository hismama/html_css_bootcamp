<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>pre, samp, code, kbd</title>
    <style>
        html { font-size: 2rem;}
    </style>
</head>
<body>

<small>&lt;pre&gt;</small><br>
<!--Pre-formatted text. Layout in HTML will appear on page. -->
<pre>
    just
    like
    this ...
    ... yes.
</pre>

<br>

<small>&lt;samp&gt;</small><br>
<!--Sample output from a computer program -->
<!-- e.g: "Keyboard not found Press F1 to continue" -->
<!-- or like a stack trace error -->
<samp>
    just
    like
    this ...
    ... yes.
</samp>

<br><br>

<small>&lt;code&gt;</small><br>
<!-- Code like python/JS/XML -->
<!-- You can wrap code with a pre but not vice versa -->
    <code>
        just
        like
        this ...
        ... yes.
    </code>

<br><br>

<small>&lt;kbd&gt;</small><br>
<!-- Represents user input. What you'd want the user to physically push. -->
<kbd>ctrl + C</kbd>

<p>example of normal text: just like this ... ... yes.</p>

</body>
</html>
